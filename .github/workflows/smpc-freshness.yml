name: Quarterly DMARD / SmPC regulatory audit
on:
  schedule:
    - cron: '23 6 23 3,6,9,12 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit canonical medicines.ie / HPRA / EMA sources
        run: python scripts/smpc_freshness_audit.py
      - name: Commit quarterly audit snapshot
        run: |
          git config user.name "smpc-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quarterly-regulatory-audit.json
          git diff --cached --quiet || git commit -m "Quarterly DMARD SmPC regulatory audit"
          git push
